name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gps-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Готовый APK одной ссылкой: вкладка Releases в репозитории
      - name: Publish release with APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gps-bridge.apk
          gh release create "build-${{ github.run_number }}" gps-bridge.apk \
            --title "GPS-мост, сборка ${{ github.run_number }}" \
            --notes "Debug-сборка. Скачай gps-bridge.apk и установи на оба телефона."
